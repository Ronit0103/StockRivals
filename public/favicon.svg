<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="bars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#27272a" stroke-width="8" />

  <!-- Rising bars -->
  <g fill="url(#bars)">
    <rect x="150" y="300" width="46" height="110" rx="8" />
    <rect x="233" y="250" width="46" height="160" rx="8" />
    <rect x="316" y="185" width="46" height="225" rx="8" />
  </g>

  <!-- Breakout arrow -->
  <path d="M150 250 L245 165 L300 205 L385 110"
        fill="none" stroke="#fafafa" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round" />
  <path d="M320 100 L390 100 L390 170" fill="none"
        stroke="#fafafa" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
